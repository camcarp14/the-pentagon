[build]
  # --include=dev: Netlify sets NODE_ENV=production, which makes a plain
  # `npm install` skip devDependencies — so vite/@vitejs/plugin-react go missing
  # and the build dies with "vite: not found". Force dev deps in.
  command = "npm install --include=dev && npm run build"
  publish = "apps/shell/dist"

[build.environment]
  NODE_VERSION = "20"
  # Also make Netlify's own dependency-install step include dev deps.
  NPM_FLAGS = "--include=dev"
  # The only env-var value Vite bakes into the client bundle is the Supabase anon
  # key/URL — public by design (anon tier; RLS protects the data, not the key).
  # Netlify's secrets scanner was failing the build on it, so disable the scan
  # for this site (also set as a real site env var so it applies regardless of
  # how [build.environment] is honored).
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Runway: weekday-morning board scan (12:00 UTC ≈ 7am ET); inert until
# SUPABASE_SERVICE_ROLE_KEY is set — see netlify/functions/scan-cron.mjs
[functions."scan-cron"]
  schedule = "0 12 * * 1-5"

# Macro (Torque): stop-watch + entry-signal sentinel, every 30 min. Ratchets the
# persisted stop high-water mark in Blobs; also sends Telegram alerts if the
# optional TELEGRAM_* vars are set — see netlify/functions/watch-snapshot.mjs
[functions."watch-snapshot"]
  schedule = "*/30 * * * *"

# Ops: the containment heartbeat — the first thing here that can work with no
# browser tab open. Every 15 minutes it registers its subsystem, opens a run,
# asks the guard, records the verdict, and closes the run. It takes no real
# action; every autonomous subsystem gets built against this shape.
#
# Inert twice over: a loud 500 until SUPABASE_SERVICE_ROLE_KEY is set, and
# ops_control ships every row disabled + dry-run, so deploying cannot switch
# anything on.
#
# BUDGET IS 30 SECONDS, not 15 minutes. Netlify scheduled functions have a
# 30-second limit and discard the response body; the 15-minute ceiling belongs
# to HTTP-invoked background functions, which is a different mechanism. An
# earlier version carried a -background suffix on that mistaken belief — the
# suffix is gone rather than left as a misleading label. Real subsystems must
# fit a pass inside 30s or persist progress and continue on the next one.
[functions."ops-heartbeat"]
  schedule = "*/15 * * * *"

# ZTS: the store-truth snapshot — the first subsystem that reads the outside
# world. Every 6 hours is deliberate rather than frequent: the two things it
# watches (can the storefront take an order, is a real order sitting unshipped)
# move on the scale of hours, and a store doing this volume gains nothing from
# a tighter loop while paying the API quota for it.
#
# Inert three times over: needs SUPABASE_SERVICE_ROLE_KEY, needs read_orders +
# read_products scopes the current token does NOT have, and its ops_control row
# ships disabled + dry-run.
[functions."zts-ingest"]
  schedule = "0 */6 * * *"

# ZTS content engine: drafts ONE article per pass, into the Desk queue for
# approval. Every 4 hours rather than once a day because volume comes from
# frequency — a single pass has 30 seconds, which is one generation call, and
# Direction's per-day cap decides how many of those passes actually do work.
# Publishing is never automatic; it is tier 2 and needs a human tap.
[functions."content-engine"]
  schedule = "0 */4 * * *"

# Clarify outbound engine: drafts ONE personalised message per pass. Offset to
# :30 so it never contends with the content engine for the same 30-second
# window. It cannot send — it has no Gmail credentials in scope.
[functions."outbound-engine"]
  schedule = "30 */2 * * *"

# Specific rewrites must resolve BEFORE the SPA catch-all.
# Clarify tracked links / open pixel:
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/track-click/:splat"
  status = 200

[[redirects]]
  from = "/px/*"
  to = "/.netlify/functions/track-open/:splat"
  status = 200

# Runway convenience alias:
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — all remaining routes serve the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
