<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (opaque, below the status bar), NOT "black-translucent":
         iOS half-applies "black-translucent" in standalone — it sizes the window
         below the status bar yet anchors it at the top, leaving a dead ~59pt
         letterbox at the BOTTOM, which floated the fixed bottom nav above the
         real screen edge. "black" gives an opaque, below-status-bar window whose
         bottom reaches the physical edge (no letterbox) with a black bar + white
         glyphs — seamless over the #0B0F1A canvas. NOTE: iOS reads this only at
         Add-to-Home-Screen time — an already-installed icon must be removed and
         re-added for the change to take effect. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pentagon" />
    <title>The Pentagon</title>
    <!-- NO WEBFONT, deliberately. This used to pull Syne, Inter and DM Mono off
         Google's CDN. The design language (DESIGN.md §3) allows no decorative
         display face and specifies the system stack; every app's token table was
         migrated, and the shell's chrome test asserts "Syne" never appears in
         its source. This <link> was missed, so the retired faces kept arriving
         and kept being applied by the two screens still naming them — System and
         Ops drew every heading and number in Syne. That is what "old fonts, and
         the spacing is huge" looked like on a phone: a wide geometric display
         face at heading sizes, in a layout measured for the system stack.
         Removing the link is half of it; the other half is that nothing names
         those families any more. Do not add it back. -->
    <style>
      * { box-sizing: border-box; }
      /* Usable bottom inset for every tool's tab bar. The real value is the
         native inset; the shell overrides this to 0px when it detects the
         letterboxed iOS standalone window, where the reported inset is dead
         space that would float the bar off the screen edge. Declared here so
         the first paint (and desktop, and plain-browser mobile) is already
         correct before the shell's effect runs. */
      :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
      html, body, #root { margin: 0; height: 100%; }
      /* The page canvas BEHIND the shell — what shows in the overscroll gutter
         and under a rubber-banding iOS window. It was a fixed near-black, which
         is right for the dark Pentagon and is a black bar across the top of a
         light one. The shell publishes --shell-canvas on <html> only once the
         operator has chosen a theme (App.jsx), so the fallback is the exact
         value that shipped and the default paint is unchanged. */
      body { background: var(--shell-canvas, #0b0d12); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
